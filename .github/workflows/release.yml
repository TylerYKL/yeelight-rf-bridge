name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP8266 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Install libraries
        run: |
          arduino-cli lib install ArduinoJson

      - name: Prepare sketch folder
        run: |
          mkdir -p firmware
          cp yeelight_rf_bridge_v2.ino firmware/firmware.ino

      - name: Compile
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:d1_mini firmware --output-dir build

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/firmware.ino.d1_mini.bin
          body: "Firmware release ${{ github.ref_name }}"

      - name: Update manifest.json
        run: |
          VER=${GITHUB_REF_NAME}
          echo "{\"version\":\"${VER#v}\",\"url\":\"https://github.com/${{ github.repository }}/releases/download/${VER}/firmware.ino.d1_mini.bin\"}" > manifest.json
          cat manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest to ${VER}" || echo "nothing to commit"
          git push
